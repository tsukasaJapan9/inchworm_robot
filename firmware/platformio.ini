[common]
platform = espressif32
board = m5stack-core2
framework = arduino
upload_speed = 115200
monitor_speed = 921600
lib_deps =
	m5stack/M5Unified@^0.2.13
	robotis-git/Dynamixel2Arduino@^0.8.2
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue

# 本番のファーム
[env:m5stack-core2]
extends = common
build_src_filter = +<main.cpp>
